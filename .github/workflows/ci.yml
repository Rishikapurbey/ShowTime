name: CI

# Lint, test and build every push to main, so a broken commit shows a red ✗ on GitHub.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes the older run pointless, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Builds without Firebase/OMDb env vars; the app turns accounts off when they're missing.
      - name: Build
        run: npm run build
